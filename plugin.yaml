name: gbrain-pointer
version: "0.1.0"
description: "Read-only GBrain recall: injects a few [source:slug] title pointers from a GBrain MCP server before each turn. Never writes to GBrain."
author: praggybuilds
license: MIT
homepage: https://github.com/praggybuilds/hermes-gbrain-pointer
requires_hermes: ">=0.21.5"
tags: [memory, gbrain, mcp, recall]
requires_env:
  - name: GBRAIN_MCP_CLIENT_ID
    description: "GBrain OAuth client id (client_credentials grant, read scope) from `gbrain mcp grant --profile memory-reader`"
  - name: GBRAIN_MCP_CLIENT_SECRET
    description: "GBrain OAuth client secret for that client"
    secret: true
optional_env:
  - name: GBRAIN_MCP_URL
    description: "GBrain MCP endpoint (default http://127.0.0.1:3131/mcp)"
  - name: GBRAIN_MCP_ACCESS_TOKEN
    description: "Pre-minted bearer token; takes precedence over the client id/secret pair and is never refreshed"
    secret: true
  - name: GBRAIN_POINTER_SOURCE
    description: "Restrict search to one GBrain source id (default: no filter)"
  - name: GBRAIN_POINTER_LIMIT
    description: "Pointers per turn, 1-10 (default 3)"
  - name: GBRAIN_POINTER_ALLOW_HTTP
    description: "Set to 1 to allow plain http to a non-loopback GBrain host"
