name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Project rules
      description: The plugin stays read-only, talks only to your GBrain server, and has no extra dependencies (see CONTRIBUTING.md).
      options:
        - label: This idea fits those rules, or I explain above why a rule should change
          required: true
