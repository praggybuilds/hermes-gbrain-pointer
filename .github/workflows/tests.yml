name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Hermes Agent
        run: python -m pip install --quiet -e ./hermes-agent
      - name: Offline tests
        working-directory: plugin
        env:
          PYTHONPATH: ${{ github.workspace }}/hermes-agent
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          export HERMES_HOME="$(mktemp -d)"
          python -m unittest discover -s tests -v
      - name: hermes plugins validate
        working-directory: plugin
        env:
          PYTHONPATH: ${{ github.workspace }}/hermes-agent
        run: |
          export HERMES_HOME="$(mktemp -d)"
          python -m hermes_cli.main plugins validate .
