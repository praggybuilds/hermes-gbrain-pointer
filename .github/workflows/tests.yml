name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Hermes Agent commit the plugin is tested against. Bump it on purpose in its own PR,
  # so a change on Hermes main can never turn this repo's required check red by itself.
  # Fixed value, no untrusted input reaches `ref:`.
  HERMES_REF: bc1f26792b80e232b32d357a170a0aef2e8560bb

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/hermes-agent
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: plugin
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_REF }}
          path: hermes-agent
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Install Hermes Agent
        run: python -m pip install --quiet -e ./hermes-agent
      - name: Isolated Hermes home
        run: echo "HERMES_HOME=$(mktemp -d)" >> "$GITHUB_ENV"
      - name: Offline tests
        working-directory: plugin
        run: python -m unittest discover -s tests -v
      - name: hermes plugins validate
        working-directory: plugin
        run: python -m hermes_cli.main plugins validate .
