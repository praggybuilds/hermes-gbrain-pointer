name: gbrain-pointer
repo: https://github.com/praggybuilds/hermes-gbrain-pointer
sha: <PIN_AFTER_PUSH>
version: "0.1.0"
title: GBrain Pointer
description: "Read-only memory.provider for GBrain (garrytan/gbrain, MIT; not affiliated). After each non-trivial turn it searches a GBrain MCP server (`gbrain serve --http`) in the background and injects up to the configured limit (3 by default, capped at 10) of `[source:slug] title` pointers into the next turn as fallible background context. It never writes to GBrain and adds no tools or hooks. Disclosure: the first 500 characters of each non-trivial user message go to GBRAIN_MCP_URL (default http://127.0.0.1:3131/mcp; plain http to a non-loopback host is refused unless the user opts in), and the profile's GBrain OAuth client id and secret go to that server's /token endpoint. Redirects are never followed. Search rows come back with GBrain's lean fields and a 1-character chunk_text fragment; only slug, title and source id are kept, the rest is discarded in memory. Minted tokens and pointers are kept in memory only, per profile and credential. No other network calls, no telemetry."
maintainer: praggybuilds
tier: community
category: memory
requires_hermes: ">=0.21.5"
docs_url: https://github.com/praggybuilds/hermes-gbrain-pointer#readme
platforms: []
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - GBRAIN_MCP_CLIENT_ID
    - GBRAIN_MCP_CLIENT_SECRET
